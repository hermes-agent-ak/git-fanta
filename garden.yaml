# Use "cargo install garden-tools" to install garden https://gitlab.com/garden-rs/garden
#
#   # Installation
#   garden install              # Install git-fanta to the installation ${prefix}
#   garden doc                  # Generate documentation: html + manual pages
#   garden install docs         # Install documentation
#
#   # Variables can be overridden using "-D name=value", e.g.:
#   garden -D prefix=$PWD/dist install docs
#   garden -D DESTDIR=/tmp/stage -D prefix=/usr/local install
#
#   # Development
#   garden test                 # Run the test suite
#   garden fmt                  # Format code using "cercis"
#   garden html                 # Generate documentation: html only
#   garden man                  # Generate documentation: manual pages only
#   garden pot                  # Regenerate git-fanta.pot with new translations
#   garden po                   # Update .po files with new translations from git-fanta.pot
#
#   # macOS
#   garden macos/app            # Build a git-fanta.app bundle
#
#   # Releases are built by .github/workflows/release.yml from a v* tag.
#   # There is deliberately no "garden publish" and no "garden release":
#   # this file used to carry Debian, Fedora, Flatpak and website trees whose
#   # push URLs pointed at repositories this fork does not own, including the
#   # upstream project's website. Add such a tree back only with a real,
#   # fork-owned URL.
trees:
  git-fanta:
    description: The highly-caffeinated Git GUI
    path: "${GARDEN_CONFIG_DIR}"
    commands:
      clean: rm -rf build dist git_fanta.egg-info git-fanta-*.windows.zip
      dev>:
        - dev/virtualenv
        - dev/pkgs
      dev/virtualenv: |
        test -e ${env-dir} || ${PYTHON} -m venv --system-site-packages ${env-dir}
        if test -n "${pip-upgrade}"
        then
            ${activate}
            pip install --upgrade pip
            pip install --upgrade setuptools packaging
        fi
      dev/pkgs>:
        - dev/development
        - dev/extras
        - dev/build
      dev/build: ${activate} pip install '.[build]'
      dev/development: ${activate} pip install '.[docs,dev,testing]'
      dev/extras: ${activate} pip install '.[extras]'
      dev/pyqt6: ${activate} pip install '.[pyqt6]'
      dev/env: ${activate} "$@"
      doc>:
        - doc/html
        - doc/man
      doc/html: garden html ${GARDEN_CMD_VERBOSE} docs -- "$@"
      doc/man: garden man ${GARDEN_CMD_VERBOSE} docs -- "$@"
      check>:
        - test
        - check/fmt
        - check/pyupgrade
        - check/mypy
      check/fmt: garden fmt -- --check
      check/pyupgrade: |
        ${activate}
        if type pyupgrade >/dev/null 2>&1
        then
            pyupgrade --py39-plus bin/git-* bin/*.py fanta/*.py fanta/*/*.py
        fi
      check/mypy: |
        ${activate}
        python3 -m mypy --config-file pyproject.toml bin fanta
      fmt: |
        ${activate}
        cercis --version
        cercis "$@" bin bin/git-* fanta test extras/sphinxtogithub
        isort --version
        isort --force-single-line-imports --py=39 --no-lines-before=STDLIB "$@" bin bin/git-* fanta test extras/sphinxtogithub
      html: garden html ${GARDEN_CMD_VERBOSE} docs
      install: |
        ${activate}
        if test -n "${DESTDIR}"
        then
            pip_root="--root=${DESTDIR}"
        fi
        pip install --disable-pip-version-check $pip_root --prefix="${prefix}" .
        # "garden install" provides the '?' hotkeys html files.
        # Sphinx docs are handled by the separate "html", "man" and "install" commands in the "docs" tree.
        mkdir -p "${DESTDIR}${appsdir}"
        mkdir -p "${DESTDIR}${docdir}"
        mkdir -p "${DESTDIR}${iconsdir}"
        mkdir -p "${DESTDIR}${metainfodir}"
        install -m 664 fanta/data/*.html "${DESTDIR}${docdir}"
        install -m 664 fanta/icons/git-fanta.svg "${DESTDIR}${iconsdir}"
        install -m 644 share/applications/*.desktop "${DESTDIR}${appsdir}"
        install -m 664 share/metainfo/*.xml "${DESTDIR}${metainfodir}"
      i18n>:
        - pot
        - po
      macos/app: |
        mkdir -p ${cola-app}/Contents/MacOS
        mkdir -p ${cola-app-resources}
        ${PYTHON} -m venv ${cola-app-resources}
        source ${cola-app-resources}/bin/activate
        pip install '.[docs,extras,pyqt6]'
        cp contrib/darwin/Info.plist contrib/darwin/PkgInfo ${cola-app}/Contents
        if test -n "${version-full}"
        then
            sed -i -e s/0.0.0.0/${version-full}/ ${cola-app}/Contents/Info.plist
        fi
        sed -i -e s/0.0.0/${version-digits}/ ${cola-app}/Contents/Info.plist
        cp contrib/darwin/git-fanta ${cola-app}/Contents/MacOS
        cp contrib/darwin/git-fanta.icns ${cola-app}/Contents/Resources
        # A stub binary makes macOS launch Python natively instead of via Rosetta.
        # https://github.com/git-cola/git-cola/issues/1485
        echo 'int main() { return 0; }' |
          cc -x c -o ${cola-app}/Contents/MacOS/git-fanta-macos -
        garden install ${GARDEN_CMD_VERBOSE} -D prefix=${cola-app-resources}
        garden doc ${GARDEN_CMD_VERBOSE}
        garden install ${GARDEN_CMD_VERBOSE} -D prefix=${cola-app-resources} docs
      man: garden man ${GARDEN_CMD_VERBOSE} docs
      pkg: git make-pkg --global --name git-fanta
      pynsist: |
        ${activate}
        rm -fr build/nsis
        garden html ${GARDEN_CMD_VERBOSE} docs
        garden install ${GARDEN_CMD_VERBOSE} -D htmldir="${TREE_PATH}/docs/html" docs
        # pynsist cannot interpolate its version, so it is substituted from
        # fanta/_version.py here. The generated file has to sit next to
        # pynsist.cfg because every path inside it is relative to that
        # directory. Do not inline this as a sed expression: pynsist.cfg has
        # two "version=" keys and rewriting [Python] version breaks the build.
        ${PYTHON} contrib/win32/generate-pynsist-config.py \
            pynsist.cfg pynsist.generated.cfg
        pynsist "$@" pynsist.generated.cfg
        rm -f pynsist.generated.cfg
        rm -rf docs/html
      po: |
        for po in fanta/i18n/*.po
        do
            msgmerge \
                --no-wrap \
                --no-fuzzy-matching \
                --output-file $$po.new \
                $$po \
                fanta/i18n/git-fanta.pot
            mv $$po.new $$po
        done
      pot: |
        xgettext \
            --language=Python \
            --keyword=N_ \
            --no-wrap \
            --omit-header \
            --output-dir fanta/i18n \
            --output git-fanta.pot \
            fanta/*.py \
            fanta/*/*.py
      run: ${activate} ./bin/git-fanta "$@"
      run/qt6: ${activate} QT_API=PyQt6 ./bin/git-fanta "$@"
      # test/widgets_main_history_test.py runs in a process of its own. Sharing
      # one with the rest of the suite segfaults roughly one run in four, at a
      # different place every time -- widget constructors, resizeEvent, even
      # inside subprocess. The file passes 15/15 on its own and the crash also
      # happens on the merge base, so it is neither this file's tests nor a
      # recent change. Splitting the run makes the suite deterministic; see
      # docs/plans/2026-08-02-release-readiness.md for the measurements.
      test: |
        ${activate}
        set -e
        ${offscreen} ${PYTEST} "$@" fanta test \
            --ignore=test/widgets_main_history_test.py
        ${offscreen} ${PYTEST} "$@" test/widgets_main_history_test.py
      tox: ${offscreen} tox run "$@"
      tox/check: ${offscreen} tox run -e check "$@"
      version/commit: git commit --all --signoff --message "git-fanta v${version-digits}"
      version/tag: git tag --sign --message "git-fanta ${version-builtin}" "v${version-builtin}"
      wheel: ${activate} python3 -m build -n .
    url: "${gh-https}/hermes-agent-ak/git-fanta.git"
    remotes:
      # The project this was forked from. Fetch-only: it is a different project
      # with a different release line, and nothing here may ever push to it.
      upstream: "${gh-https}/git-cola/git-cola.git"
  docs:
    description: Sphinx documentation
    variables:
      env-dir: ../env3
    commands:
      clean: rm -fr _build
      doctest: ${activate} ${SPHINX} -b doctest . _build/doctest "$@"
      html: ${activate} ${SPHINX} -b html . _build/html "$@"
      man: ${activate} ${SPHINX} -b man . _build/man "$@"
      linkcheck: ${activate} ${SPHINX} -b linkcheck . _build/linkcheck "$@"
      install<:
        - html
        - man
      install: |
        ${activate}
        mkdir -p "${DESTDIR}${docdir}"
        install -m 644 ../fanta/data/*.html "${DESTDIR}${docdir}"
        install -m 644 *.rst "${DESTDIR}${docdir}"
        # HTML documentation
        mkdir -p "${DESTDIR}${htmldir}"
        rsync -r --delete --exclude=.buildinfo _build/html/ "${DESTDIR}${htmldir}/"
        # Manual pages
        mkdir -p "${DESTDIR}${mandir}"
        install -m 644 _build/man/git-fanta.1 "${DESTDIR}${mandir}"
        install -m 644 _build/man/git-fanta-dag.1 "${DESTDIR}${mandir}"
commands:
  commit: git commit "$@"
  diff: git diff "$@"
  diffs: git diff --staged "$@"
  fetch: git fetch "$@"
  stat: git status --short "$@"
  status: git status "$@"
  stage: git add -u "$@"
  push: git push "$@"
  pull: git pull --ff-only "$@"

# Variables can be overridden externally using "garden -D name=value ...".
variables:
  # DESTDIR + prefix variables: https://www.gnu.org/software/make/manual/html_node/DESTDIR.html
  DESTDIR: ""
  prefix: ${GARDEN_CONFIG_DIR}/dist
  appsdir: ${datadir}/applications
  datadir: ${prefix}/share
  docdir: ${prefix}/share/doc/git-fanta
  htmldir: ${docdir}/html
  iconsdir: ${datadir}/icons/hicolor/scalable/apps
  mandir: ${prefix}/share/man/man1
  metainfodir: ${datadir}/metainfo
  cola-app: ${TREE_PATH}/git-fanta.app
  cola-app-resources: ${cola-app}/Contents/Resources
  is-virtualenv: |
    $ ${PYTHON} -c '
    import os, sys
    if sys.prefix != sys.base_prefix or os.environ.get("VIRTUAL_ENV"):
        print("true")
    '
  env-dir: env3
  activate: |
    if test -z "${is-virtualenv}" && test -f "${env-dir}/bin/activate"
    then
        source "${env-dir}/bin/activate"
    fi
  offscreen: "QT_QPA_PLATFORMTHEME=offscreen QT_QPA_PLATFORM=offscreen"
  pip-editable: "--editable"
  pip-upgrade: ""
  version-digits: |
    $ eval "$(sed -e 's/ //g' "${GARDEN_CONFIG_DIR}/fanta/_version.py")"
    printf '%s' "$VERSION"
  version-builtin: $ ${GARDEN_CONFIG_DIR}/bin/git-fanta version --brief --builtin
  version-full: $ ${GARDEN_CONFIG_DIR}/bin/git-fanta version --brief
  version-git: $ git -C "${GARDEN_CONFIG_DIR}" describe --first-parent --abbrev=0
  version-next: |
    $ ${PYTHON} -c "
    import sys
    version = sys.argv[1]
    parts = version.split('.')
    parts[1] = f'{int(parts[1]) + 1}'
    parts[2] = '0'
    print('.'.join(parts))
    " "${version-git}"
  gh-https: "https://github.com"
  gh-ssh: "git@github.com"
  gl-https: "https://gitlab.com"
  gl-ssh: "git@gitlab.com"
  # External commands and options
  PYTEST: ${PYTHON} -B -m pytest ${PYTEST-OPTIONS}
  PYTEST-OPTIONS: $ test "$(uname -s)" != Linux && printf '%s' --ignore=fanta/inotify.py
  PYTHON: python3
  SPHINX: ${PYTHON} -m sphinx -d _build/doctrees -a
